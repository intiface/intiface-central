[package]
name = "rust_lib_intiface_central"
version = "2.1.2"
license-file = "../LICENSE.md"
authors = ["Nonpolynomial Labs, LLC <kyle@nonpolynomial.com>"]
description = "Rust-Flutter bridge for IntifaceEngine" 
homepage = "http://intiface.com"
readme = "README.md"
edition = "2024"
exclude = [".vscode/**"]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = { version = "=2.12.0", features = ["uuid"] }
buttplug_core = "11.0.1"
buttplug_server = "12.0.0"
buttplug_server_device_config = "12.0.0"
intiface-engine = "5.0.1"
#buttplug_core = { path = "../../buttplug/crates/buttplug_core" }
#buttplug_server = { path = "../../buttplug/crates/buttplug_server" }
#buttplug_server_device_config = { path = "../../buttplug/crates/buttplug_server_device_config" }
#intiface-engine = { path = "../../buttplug/crates/intiface_engine" }
log = "0.4.34"
lazy_static = "1.5.0"
once_cell = "1.21.4"
tokio = { version = "1.53.1", features = ["rt", "tracing"] }
anyhow = "1.0.104"
# THIS VERSION ABSOLUTELY, POSITIVELY MUST MATCH WHATEVER BUTTPLUG LINKS, OTHERWISE THERE WILL BE
# STATIC MISALIGNMENT AND YOU DO NOT WANT TO SPEND ANOTHER 3 DAYS DEBUGGING THAT.
#btleplug = { version = "0.12", path = "../../btleplug" }
btleplug = { version = "0.13" }
thiserror = "2.0.20"
getset = "0.1.7"
serde = "1.0.229"
serde_json = "1.0.151"
async-trait = "0.1.92"
futures = "0.3.34"
tracing = "0.1.44"
tracing-futures = "0.2.5"
tracing-subscriber = "0.3.23"
log-panics = { version = "2.1.0", features = ["with-backtrace"] }
sentry = { version = "0.49.2", default-features = false, features = ["backtrace", "contexts", "panic", "debug-images", "reqwest", "rustls"] }
crossbeam-channel = "0.5.17"
parking_lot = "0.12"
uuid = "1.26.1"

[target.'cfg(target_os = "android")'.dependencies]
# THESE VERSIONS ABSOLUTELY, POSITIVELY MUST MATCH WHATEVER BUTTPLUG LINKS, OTHERWISE THERE WILL BE
# STATIC MISALIGNMENT AND YOU DO NOT WANT TO SPEND ANOTHER 3 DAYS DEBUGGING THAT.
jni = "0.22.4"

# Local buttplug development tree. Manifest-level patches (unlike the
# .cargo/config.toml variety) apply no matter where the build is invoked
# from — Xcode's iOS builds run cargo from DerivedData, outside the repo.
# [patch.crates-io]
# buttplug_client = { path = "../../buttplug/crates/buttplug_client" }
# buttplug_client_in_process = { path = "../../buttplug/crates/buttplug_client_in_process" }
# buttplug_core = { path = "../../buttplug/crates/buttplug_core" }
# buttplug_server = { path = "../../buttplug/crates/buttplug_server" }
# buttplug_server_device_config = { path = "../../buttplug/crates/buttplug_server_device_config" }
# buttplug_server_hwmgr_btleplug = { path = "../../buttplug/crates/buttplug_server_hwmgr_btleplug" }
# buttplug_server_hwmgr_lovense_connect = { path = "../../buttplug/crates/buttplug_server_hwmgr_lovense_connect" }
# buttplug_server_hwmgr_lovense_dongle = { path = "../../buttplug/crates/buttplug_server_hwmgr_lovense_dongle" }
# buttplug_server_hwmgr_sdl_gamepad = { path = "../../buttplug/crates/buttplug_server_hwmgr_sdl_gamepad" }
# buttplug_server_hwmgr_serial = { path = "../../buttplug/crates/buttplug_server_hwmgr_serial" }
# buttplug_server_hwmgr_websocket = { path = "../../buttplug/crates/buttplug_server_hwmgr_websocket" }
# buttplug_transport_websocket_tungstenite = { path = "../../buttplug/crates/buttplug_transport_websocket_tungstenite" }
# intiface-engine = { path = "../../buttplug/crates/intiface_engine" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
