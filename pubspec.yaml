name: intiface_central
description: Intiface® Central

publish_to: 'none'
version: 3.2.0+44

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  bloc: ^9.2.0
  bloc_concurrency: ^0.3.0
  buttplug: ^1.0.0
  cupertino_icons: ^1.0.8
  device_info_plus: ^13.2.0
  easy_debounce: ^2.0.3
  equatable: ^2.1.0
  # Needed for rust ffigen
  ffi: ^2.1.4
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  flutter_foreground_task: ^11.0.3
  flutter_loggy: ^2.0.3+1
  flutter_markdown_plus: ^1.0.12
  flutter_rust_bridge: ^2.13.0
  flutter_spinkit: ^5.2.2
  freezed_annotation: ^3.1.0
  github: ^9.25.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  loggy: ^2.0.3
  markdown: ^7.3.0
  network_info_plus: ^8.2.1
  path_provider: ^2.1.5
  path: ^1.9.1
  percent_indicator: ^4.2.5
  permission_handler: ^13.0.0
  plugin_platform_interface: ^2.1.8
  rxdart: ^0.28.0
  screen_retriever: ^0.2.0
  sentry_flutter: ^10.0.0-alpha.6
  sentry: ^10.0.0-alpha.6
  flutter_settings_ui: ^3.0.1
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2
  version: ^3.0.2
  web_socket_channel: ^3.0.3
  tray_manager: ^0.7.0
  window_manager: ^0.5.1
  flutter_multi_slider: ^2.0.1
  discord_rich_presence: ^1.1.1
  pubspec_parse: ^1.5.0
  rust_lib_intiface_central:
    path: rust_builder

  meta: ^1.17.0
  uuid: ^4.5.2
dev_dependencies:
  build_runner: ^2.10.4
  # Needed for rust ffigen
  ffigen: ^22.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^4.0.1
  integration_test:
    sdk: flutter
  json_serializable: ^6.11.2
  test: ^1.28.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  # Must specify each directory explicitly, this is not a recursive include.
  assets:
    - assets/
    - assets/icons/
    - pubspec.yaml

flutter_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/intiface_central_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  web:
    generate: false  
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
  linux:
    generate: true
